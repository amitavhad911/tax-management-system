server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tax_management_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:root123}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  sql:
    init:
      mode: never

logging:
  level:
    root: INFO
    com.taxmanagement: DEBUG

app:
  jwt:
    secret: ${JWT_SECRET:aVeryLongSecretKeyThatShouldBeStoredSecurely}
    expiration-ms: 86400000