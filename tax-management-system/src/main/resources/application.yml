server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/tax_management_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  sql:
    init:
      mode: never

logging:
  level:
    root: INFO
    com.taxmanagement: DEBUG

app:
  jwt:
    secret: aVeryLongSecretKeyThatShouldBeStoredSecurely
    expiration-ms: 86400000
